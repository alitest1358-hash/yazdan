<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دریافت فایل انتخاب رشته</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #f2f4f8; display: flex;
           justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; padding: 32px; border-radius: 12px; width: 320px;
           box-shadow: 0 2px 12px rgba(0,0,0,.1); text-align: center; }
    input { width: 100%; padding: 10px; font-size: 18px; text-align: center;
            box-sizing: border-box; direction: ltr; margin: 12px 0; }
    button { width: 100%; padding: 10px; font-size: 16px; background: #2563eb;
             color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    #msg { margin-top: 12px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>دریافت فایل شما</h2>
    <p>کد خود را وارد کنید:</p>
    <input id="code" type="text" autocomplete="off" autocapitalize="none" autocorrect="off">
    <button onclick="getFile()">دریافت فایل</button>
    <div id="msg"></div>
  </div>

  <script>
    function normalize(s) {
      return s.trim().toLowerCase()
        .replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0)
        .replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660);
    }

    function show(text, color) {
      const m = document.getElementById("msg");
      m.textContent = text;
      m.style.color = color;
    }

    async function getFile() {
      const code = normalize(document.getElementById("code").value);
      if (!/^[a-z0-9]{6,20}$/.test(code)) {
        show("کد معتبر نیست.", "#c00");
        return;
      }
      show("در حال دریافت...", "#333");
      try {
        const res = await fetch("files/" + code + ".pdf");
        if (!res.ok) {
          show("کد اشتباه است.", "#c00");
          return;
        }
        const blob = await res.blob();
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "entekhab-reshte.pdf";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 10000);
        show("دانلود شروع شد.", "green");
      } catch (e) {
        show("خطا در اتصال. دوباره تلاش کن.", "#c00");
      }
    }
  </script>
</body>
</html>
